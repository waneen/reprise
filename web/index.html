<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reprise（ブラウザ版）</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: system-ui, sans-serif; }
  #setup { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  #setup h1 { font-size: 20px; margin: 0 0 4px; }
  #setup p { color: #999; font-size: 13px; margin: 0 0 16px; }
  .pick { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin: 0 0 12px; }
  .pick ul { flex-basis: 100%; margin: 0; padding-left: 20px; color: #aaa; font-size: 13px; overflow-wrap: anywhere; }
  button { font-size: 15px; padding: 8px 20px; background: #2d5bd7; color: #fff; border: 0; border-radius: 6px; }
  button.sub { background: #333; }
  button:disabled { background: #444; color: #888; }
  input[type=file] { display: none; }
  #status { color: #aaa; font-size: 13px; min-height: 1.4em; margin-top: 8px; white-space: pre-wrap; }
  #game { display: none; position: fixed; inset: 0; }
  #game canvas { width: 100%; height: 100%; display: block; outline: none; }
</style>
</head>
<body>
<!-- ブラウザはフォルダを読めないので、ネイティブ版の config.json の songs と skin_root に当たるフォルダだけをここで選ぶ。
     ほかはネイティブ版と同じ（選曲画面から始まる。設定はこのページの保存領域に config.json と同じ中身で置く） -->
<div id="setup">
  <h1>reprise（ブラウザ版）</h1>
  <p>選んだフォルダのファイルはこのページの中だけで読み、どこにも送りません。キーは 皿 = 左 Shift / 左 Ctrl、鍵盤 = Z S X D C F V、START = Q、SELECT = W。</p>
  <div class="pick">
    <button id="add-songs" class="sub">譜面のフォルダを追加</button>
    <ul id="songs-list"></ul>
    <input id="songs-input" type="file" webkitdirectory multiple>
  </div>
  <div class="pick">
    <button id="pick-lr2" class="sub">LR2 本体のフォルダ（任意）</button>
    <ul id="lr2-list"></ul>
    <input id="lr2-input" type="file" webkitdirectory multiple>
  </div>
  <button id="start" disabled>はじめる</button>
  <div id="status"></div>
</div>
<div id="game"><canvas id="bevy" tabindex="0"></canvas></div>
<script type="module">
const $ = (id) => document.getElementById(id);
// 選んだフォルダ（{ root: ページの中のパス, files: [[root からのパス, File を返す関数]] }）
const songs = [];
let lr2 = null;
// LR2 本体のうちスキンが使うところ（LR2files の Theme・Font・Config）だけ読む
const LR2_PART = /^LR2files\/(Theme|Font|Config)\//i;

// File System Access でフォルダの中のファイルを集める（keep が偽のフォルダは開かない）
async function walk(dir, prefix, keep, out) {
  for await (const [name, h] of dir.entries()) {
    const p = prefix + name;
    if (h.kind === "file") {
      if (keep(p)) out.push([p, () => h.getFile()]);
    } else if (keep(p + "/")) {
      await walk(h, p + "/", keep, out);
    }
  }
}

// フォルダを 1 つ選ぶ（File System Access が無ければ input の webkitdirectory）。{ name, files } か、やめたら null
async function pickFolder(input, keep) {
  if (window.showDirectoryPicker) {
    let dir;
    try { dir = await window.showDirectoryPicker(); } catch { return null; }
    const files = [];
    $("status").textContent = "フォルダを調べています…";
    await walk(dir, "", keep, files);
    $("status").textContent = "";
    return { name: dir.name, files };
  }
  return new Promise((resolve) => {
    input.value = "";
    input.onchange = () => {
      const all = [...input.files];
      if (all.length === 0) return resolve(null);
      const name = all[0].webkitRelativePath.split("/")[0];
      const files = all
        .map((f) => [f.webkitRelativePath.slice(name.length + 1), () => f])
        .filter(([p]) => keep(p));
      resolve({ name, files });
    };
    input.click();
  });
}

const lr2Keep = (p) => LR2_PART.test(p) || /^LR2files\/?$/i.test(p) || /^LR2files\/(Theme|Font|Config)\/?$/i.test(p);

$("add-songs").onclick = async () => {
  const f = await pickFolder($("songs-input"), () => true);
  if (!f) return;
  songs.push({ root: `/songs${songs.length}/${f.name}`, files: f.files });
  $("songs-list").append(Object.assign(document.createElement("li"), { textContent: `${f.name}（${f.files.length} ファイル）` }));
  $("start").disabled = false;
};
$("pick-lr2").onclick = async () => {
  const f = await pickFolder($("lr2-input"), lr2Keep);
  if (!f) return;
  lr2 = { root: `/lr2/${f.name}`, files: f.files };
  $("lr2-list").replaceChildren(Object.assign(document.createElement("li"), { textContent: f.name }));
};

$("start").onclick = async () => {
  for (const b of document.querySelectorAll("button")) b.disabled = true;
  const all = [...songs, ...(lr2 ? [lr2] : [])].flatMap((d) => d.files.map(([p, get]) => [`${d.root}/${p}`, get]));
  const files = new Map();
  let done = 0;
  for (const [p, get] of all) {
    const f = await get();
    files.set(p, new Uint8Array(await f.arrayBuffer()));
    if (++done % 50 === 0) $("status").textContent = `読み込み中 ${done} / ${all.length}`;
  }
  const args = songs.flatMap((d) => ["--songs", d.root]);
  if (lr2) args.push("--skin-root", lr2.root);
  globalThis.repriseFiles = files;
  globalThis.repriseArgs = args;
  $("setup").style.display = "none";
  $("game").style.display = "block";
  $("bevy").focus();
  try {
    const { default: init } = await import("./pkg/reprise.js");
    await init();
  } catch (e) {
    // Bevy（winit）はイベントループを例外で抜けるので、それ以外だけ伝える
    if (!String(e).includes("Using exceptions for control flow")) {
      $("setup").style.display = "block";
      $("game").style.display = "none";
      $("status").textContent = "起動できませんでした: " + e;
    }
  }
};
</script>
</body>
</html>
