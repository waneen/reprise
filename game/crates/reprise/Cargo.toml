[package]
name = "reprise"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
domain.workspace = true
application.workspace = true
chart-loader = { path = "../adapters/chart-loader" }
skin-loader = { path = "../adapters/skin-loader" }
file-system = { path = "../adapters/file-system" }
# 設定（config.json の中身。ネイティブはファイル、ブラウザ版はページの保存領域に置く）
settings-json = { path = "../adapters/settings-json" }
reprise-chart-bms.workspace = true
reprise-chart-bmson.workspace = true
reprise-skin-lr2csv.workspace = true
reprise-skin-beatoraja.workspace = true
# Bevy に依存するのはこの crate だけ
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "2d_bevy_render",
    "ui_bevy_render",
    "bevy_audio",
    "wav",
    "vorbis",
    "mp3",
    "flac",
] }
# 読めない音を事前にはじくため（Bevy と同じ版。形式は Bevy の features で有効になる）
rodio = { version = "0.22", default-features = false }
# ランチャー（設定画面）を egui で描く
bevy_egui = { version = "0.42.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
# スキン画像の読み込み（抜き色を自前で処理するため）
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "tga"] }

# ネイティブだけ: 記録と曲の DB（sqlite）と OS のフォント
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
score-import-lr2 = { path = "../adapters/score-import-lr2" }
score-import-beatoraja = { path = "../adapters/score-import-beatoraja" }
score-db = { path = "../adapters/score-db" }
# 曲の DB（LR2 の song.db と同じテーブル）とフォルダの見張り、カスタムフォルダの SQL
library-watch = { path = "../adapters/library-watch" }
song-db = { path = "../adapters/song-db" }
# 難易度表（beatoraja の難易度表を HTTP で取ってくる）
bms-table = { path = "../adapters/bms-table" }
# TEXT のシステムフォント（OS のフォントから探す）
bevy = { version = "0.19.1", default-features = false, features = ["system_font_discovery"] }
# ランチャーの日本語の字を OS のフォントから探す（Bevy の文字と同じ版）
fontique = "0.9"

# ブラウザだけ: ページから渡されたファイルと引数を読む
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["web"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
# 曲サーバーにつなぐ（ファイル・曲一覧・記録・カスタムフォルダの SQL）
remote = { path = "../adapters/remote" }
