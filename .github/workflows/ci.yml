name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 各OSでネイティブにビルド＆テスト
  test:
    name: test (${{ matrix.os }}, ${{ matrix.workspace }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # macos-latest = Apple Silicon (aarch64)
        workspace: [chart-formats, skin-formats, game]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  # 他アーキテクチャはクロスビルドで確認（実行はしない）
  cross-build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: macos-latest,   target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 linker (Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: game
      - name: Build all workspaces
        shell: bash
        run: |
          for ws in chart-formats skin-formats game; do
            (cd "$ws" && cargo build --workspace --release --target ${{ matrix.target }})
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - shell: bash
        run: |
          for ws in chart-formats skin-formats game; do
            (cd "$ws" && cargo fmt --all --check && cargo clippy --workspace --all-targets)
          done
