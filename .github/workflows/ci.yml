name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# 同じブランチ・PR の古い実行は止めて、無駄な実行時間を減らす
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI はテストと lint だけ。他アーキテクチャのクロスビルドは手元で tools/cross-build.sh を実行する

jobs:
  # 各OSでネイティブにビルド＆テスト
  test:
    name: test (${{ matrix.os }}, ${{ matrix.workspace }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # macos-latest = Apple Silicon (aarch64)
        workspace: [chart-formats, skin-formats, game]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Install Bevy の依存（Linux）
        if: runner.os == 'Linux' && matrix.workspace == 'game'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: game
      - name: Install Bevy の依存
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
      - shell: bash
        run: |
          for ws in chart-formats skin-formats game; do
            (cd "$ws" && cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings)
          done
      - name: 仕様ルールとテストの 1 対 1 対応
        run: python3 tools/check_rules.py
